# Generate the Xcode project:  brew install xcodegen && xcodegen
name: Table 1
options:
  bundleIdPrefix: site.table1
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "54"
    DEVELOPMENT_TEAM: "94889YTX94"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.20.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "9.0.0"
  # Scryfall set icons are SVG only; SwiftUI can't draw SVG.
  SVGView:
    url: https://github.com/exyte/SVGView
    from: "1.0.6"
  # Telemetry (contract/telemetry-2026-10-15.md): product analytics and crash reporting.
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    from: "3.92.0"
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: "9.30.0"
  # The scanner's name index, built optimized in Debug too (Packages/ScanIndex/Package.swift).
  ScanIndex:
    path: Packages/ScanIndex
targets:
  Table1:
    type: application
    platform: iOS
    sources:
      - Table1
      - Shared
      # The feature spots (contract/feature-spots-2026-11-01.md): copy and phone shots shared with the web and
      # Android, bundled as the folder `spots/` (spots.json, shots/<key>.png). Shipped in Release.
      - path: ../../marketing/bundle/spots
        type: folder
        buildPhase: resources
    dependencies:
      - target: Table1Widgets
      - package: Supabase
        product: Supabase
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
      - package: SVGView
      - package: PostHog
      # Sentry-Dynamic ships each slice's dSYM; the static "Sentry" product has none, so App Store Connect
      # reported "Upload Symbols Failed" for Sentry.framework.
      - package: Sentry
        product: Sentry-Dynamic
      - package: ScanIndex
    entitlements:
      path: Table1/Table1.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        com.apple.developer.associated-domains: ["applinks:table-1.site", "applinks:www.table-1.site"]
        # Live Activity pushes. Xcode switches this to production when archiving for TestFlight.
        aps-environment: development
        com.apple.security.application-groups: [group.site.table1.events]
        keychain-access-groups: ["$(AppIdentifierPrefix)site.table1.shared"]
    info:
      path: Table1/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: Table 1
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        # Only standard HTTPS/TLS is used, so no export-compliance question on each upload.
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Scan an organizer's QR code to join their event, scan cards into your collection, a trade or a redraft, and photograph your deck.
        NSPhotoLibraryAddUsageDescription: Save deck images to your photos.
        NSLocationWhenInUseUsageDescription: Find events happening near you and pin your event where you are. Your location is never stored.
        # Google Sign-In: the iOS OAuth client (Google Cloud), also listed in Supabase Auth > Google.
        GIDClientID: 89942584264-hdu3fdk26n4p77hoeg95levoqf3pb8k1.apps.googleusercontent.com
        CFBundleURLTypes:
          # Widget and Live Activity taps: table1://event/<id>
          - CFBundleURLSchemes: [table1]
          # Google's sign-in return: the iOS client ID reversed.
          - CFBundleURLSchemes: [com.googleusercontent.apps.89942584264-hdu3fdk26n4p77hoeg95levoqf3pb8k1]
        NSSupportsLiveActivities: true
        # Telemetry keys are public client keys; empty turns telemetry off (contract/telemetry-2026-10-15.md).
        T1PostHogKey: phc_oHJjVpcbVgGC3nKN5bLq2PvnbLeoSaBYKHHUkZVcM4Mx
        T1PostHogHost: https://us.i.posthog.com
        T1SentryDSN: https://6097387cbe32a6173982508c203109b2@o4512260999675904.ingest.us.sentry.io/4512261002428416
        T1SupabaseURL: https://aaozhfcbvqrgkkrihkrd.supabase.co
        T1SupabaseAnonKey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFhb3poZmNidnFyZ2trcmloa3JkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQwMDE5MTUsImV4cCI6MjA3OTU3NzkxNX0.7TyCLK4NZsiKXbLU504T3CxLdnHrp95FVKgpnKEMrKI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: site.table1.events
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        # The Library and Insights demos (-T1LibraryDemo, -T1InsightsDemo; Debug only) and their data never ship.
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: "library-demo.json insights-demo-*.json"

  # Widgets, the player and organizer Live Activities (Lock Screen, Dynamic Island, StandBy, Smart Stack) and the
  # iOS 18 controls (contract/widgets-2026-10-22.md).
  Table1Widgets:
    type: app-extension
    platform: iOS
    sources:
      - Table1Widgets
      - Shared
    dependencies:
      - package: Supabase
        product: Supabase
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: Table1Widgets/Table1Widgets.entitlements
      properties:
        com.apple.security.application-groups: [group.site.table1.events]
        keychain-access-groups: ["$(AppIdentifierPrefix)site.table1.shared"]
    info:
      path: Table1Widgets/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: Table 1
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: site.table1.events.widgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES

  # Pure-logic tests (catalog pack parsing, name normalization). Compiles the code it tests directly, so it
  # needs no host app and no Supabase.
  Table1Tests:
    type: bundle.unit-test
    platform: iOS
    # Hosted in the app (@testable import Table1), so the scanner tests run the real catalog SQL.
    sources:
      - Table1Tests
    dependencies:
      - target: Table1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: site.table1.events.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"

# Shared scheme, so it survives every xcodegen run.
schemes:
  Table 1:
    build:
      targets:
        Table1: all
        Table1Widgets: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [Table1Tests]
    profile:
      config: Release
    archive:
      config: Release
      # Sends the archive's dSYMs to Sentry so iOS crash and hang reports are readable (tools/upload_dsyms.sh;
      # skips quietly without sentry-cli or the Keychain token; log in ~/Library/Logs/Table1/dsym-upload.log).
      postActions:
        - name: Upload dSYMs to Sentry
          settingsTarget: Table1
          script: |
            "${PROJECT_DIR}/tools/upload_dsyms.sh" "${ARCHIVE_DSYMS_PATH}"
